name: solectricity_app
description: "A new BCSIR project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  shared_preferences: ^2.3.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.2
  url_launcher: ^6.3.3
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.1
  google_maps_flutter: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"